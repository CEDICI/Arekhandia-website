name: Capture portfolio previews

on:
  push:
    paths:
      - ".github/workflows/project-previews.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Capture real website screenshots
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || { echo "Chrome is missing"; exit 1; }
          mkdir -p assets
          python3 -m pip install --quiet --user Pillow playwright || python3 -m pip install --quiet Pillow playwright --break-system-packages
          CHROME_BIN="$CHROME" python3 - <<'PY'
          import os
          from PIL import Image, ImageOps
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, executable_path=os.environ["CHROME_BIN"], args=["--no-sandbox", "--disable-dev-shm-usage"])
              for site, url in (("cedici", "https://cedici.ch/"), ("gymcompare", "https://gymcompare.ch/")):
                  page = browser.new_page(viewport={"width": 1600, "height": 1000}, device_scale_factor=1)
                  page.goto(url, wait_until="domcontentloaded", timeout=60000)
                  page.wait_for_timeout(5000)
                  if site == "cedici":
                      # Close the newsletter overlay so the real website is visible.
                      page.mouse.click(1538, 690)
                      page.wait_for_timeout(500)
                      page.evaluate("""() => {
                        const nodes=[...document.querySelectorAll('*')].filter(el=>el.textContent?.trim()==='Join CEDICI');
                        for (const start of nodes) {
                          let el=start;
                          for (let i=0;i<12 && el && el!==document.body;i++,el=el.parentElement) {
                            const b=el.getBoundingClientRect();
                            if (b.width>280 && b.width<750 && b.height>160 && b.height<750
                                && ['fixed','absolute'].includes(getComputedStyle(el).position)) {
                              el.style.display='none';
                              return;
                            }
                          }
                        }
                      }""")
                  source=f"/tmp/{site}.png"
                  page.screenshot(path=source, full_page=False, animations="disabled")
                  img=Image.open(source).convert("RGB")
                  img=ImageOps.fit(img,(1200,750),centering=(0.5,0.0))
                  out=f"assets/{site}-site-preview.webp"
                  img.save(out,"WEBP",quality=82,method=5)
                  print(site, img.size, os.path.getsize(out))
                  page.close()
              browser.close()
          PY
      - name: Publish website previews
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cedici-site-preview.webp assets/gymcompare-site-preview.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add real website screenshots for portfolio"
            git push
          fi
